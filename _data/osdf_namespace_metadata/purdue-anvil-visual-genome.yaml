description: |
  [Visual Genome](https://homes.cs.washington.edu/~ranjay/visualgenome/index.html) is a dataset, a knowledge base, and an ongoing effort to connect structured image concepts to language, created at Stanford University with collaborators at TU Dresden, Yahoo, Snapchat, and CWI Amsterdam. It contains over 108K images (drawn from the intersection of YFCC100M and MS-COCO) with dense crowdsourced annotations: an average of 35 objects, 26 attributes, and 21 pairwise relationships per image, totaling 5.4 million region descriptions, 1.7 million visual question-answer pairs, 3.8 million object instances, 2.8 million attributes, and 2.3 million relationships, all canonicalized to WordNet synsets. By modeling objects, attributes, and relationships as scene graphs, Visual Genome enables research on cognitive vision tasks such as image description, visual question answering, and visual relationship detection that go beyond perceptual recognition.

  This data is public and available under the Creative Commons Attribution 4.0 (CC BY 4.0) license. This dataset is hosted on Purdue University's [Anvil cluster](https://www.rcac.purdue.edu/anvil) — available read-only from the S3 Anvil Object Storage ai-datasets bucket and as compressed LMDB/SquashFS images on the filesystem.

  Details about the dataset can be found at [RCAC Documentation website](https://docs.rcac.purdue.edu/datasets/ai/visualgenome/).

