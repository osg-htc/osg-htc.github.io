description: |
  [PhysicalAI-Robotics-Manipulation-SingleArm](https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm) is a collection of automatically generated motion datasets created by NVIDIA, featuring a Franka Panda robot performing operations such as block stacking and opening cabinets and drawers. The dataset was generated in NVIDIA Isaac Sim using task and motion planning algorithms (PDDLStream, CuRobo) to solve tasks automatically, in tabletop scenes where object layouts and asset textures are procedurally generated. It comprises six datasets in LeRobot format (panda-stack-wide, panda-stack-platforms, panda-stack-platforms-texture, panda-open-cabinet-left, panda-open-cabinet-right, panda-open-drawer) with RGB and depth video from world and wrist-mounted cameras plus proprioceptive state observations, intended for training robot policies and foundation models. This dataset is available for commercial use.

  This data is public and freely available under the Creative Commons Attribution 4.0 (CC BY 4.0) license. This dataset is hosted on Purdue University's [Anvil cluster](https://www.rcac.purdue.edu/anvil) — available read-only from the Purdue Anvil Pelican origin server.

  Details about the dataset can be found at [RCAC Documentation website](https://docs.rcac.purdue.edu/datasets/ai/PhysicalAI-Robotics-Manipulation-SingleArm/).

