description: |
  [DROID (Distributed Robot Interaction Dataset)](https://droid-dataset.github.io) is a large-scale, open-source dataset for robot manipulation collected across diverse real-world environments. It comprises 76k demonstration trajectories (~350 hours of interaction) collected over 12 months using Franka Panda arms across 564 scenes and 86 tasks, supporting generalist robot policy training.

  This data is public and freely available under the Creative Commons Attribution 4.0 (CC BY 4.0) license. This dataset is hosted on Purdue University's [Anvil cluster](https://www.rcac.purdue.edu/anvil) — available read-only from the Purdue Anvil Pelican origin server.

  Details about the dataset can be found at [RCAC Documentation website](https://docs.rcac.purdue.edu/datasets/ai/droid/).

