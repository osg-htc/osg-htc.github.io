description: |
  PhysicalAI-Robotics-GR00T-Teleop-Sim is a dataset created by NVIDIA GEAR consisting of 1,000 teleoperation trajectories per task (24 tabletop tasks) recorded in simulation using the GR1 humanoid robot with upper-body control and simulated Fourier hands. The simulation setup mimics tabletop manipulation tasks and uses RGB observations from a virtual camera, with accompanying language instructions (e.g., “pick up the bottled water, place it into the cabinet and close the cabinet”). The data is provided in HDF5 and LeRobot formats and is intended for AI-driven robotics research, algorithm development in simulation, and non-commercial benchmarking and prototyping of policies for tabletop tasks.

  This data is public, but restricted to non-commercial use under the Creative Commons Attribution-NonCommercial 4.0 (CC BY-NC 4.0) license. This dataset is hosted on Purdue University's Anvil cluster — available read-only from the Purdue Anvil Pelican origin server.

